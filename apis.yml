name: Sidecar Health
description: Sidecar Health is a health insurance company founded in 2018 by Patrick Quigley and Veronica
  Osetinsky and headquartered in Columbus, Ohio. It was built to bring transparency to healthcare pricing,
  letting members see upfront cash prices for care and share in the savings. After launching with supplemental
  coverage for individuals, Sidecar established its own insurance carrier in 2021 and today serves large
  employers with ACA-compliant major medical plans, offered both fully insured and as administrative-services-only
  (ASO) for self-funded employers. It covers members in 46 states across partners in 50 industries. Sidecar
  Health operates member, provider, broker, and employer web portals plus a mobile app, but publishes
  no public developer API, OpenAPI, or partner-integration documentation; this profile captures its public
  identity and domain-security posture.
